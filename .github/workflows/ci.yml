name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The core must build with a plain C++17 compiler and nothing but its own include dir and
  # ArduinoJson (fetched by CMakeLists.txt): an Arduino, ESP-IDF or FreeRTOS header in any
  # source or header fails here. The same build runs the core's Unity suites.
  core-host-build:
    name: Core build and tests (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-core
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build-core -j --verbose

      - name: Test
        run: ctest --test-dir build-core --output-on-failure

      # ebus_mqtt depends on nothing: each of its sources and headers must compile with
      # its own include directory as the only one, so a Homie or ArduinoJson include fails.
      - name: ebus_mqtt alone
        run: |
          set -e
          flags="-std=c++17 -Wall -Wextra -Werror -I mqtt/include"
          for f in mqtt/src/*.cpp; do
            echo "$f"
            ${{ matrix.cxx }} $flags -c "$f" -o /dev/null
          done
          for h in mqtt/include/ebus/mqtt/*.h; do
            echo "$h"
            echo "#include <${h#mqtt/include/}>" | ${{ matrix.cxx }} $flags -x c++ -c - -o /dev/null
          done

      # ebus_discovery likewise: its own include directory and nothing else.
      - name: ebus_discovery alone
        run: |
          set -e
          flags="-std=c++17 -Wall -Wextra -Werror -I discovery/include"
          for f in discovery/src/*.cpp; do
            echo "$f"
            ${{ matrix.cxx }} $flags -c "$f" -o /dev/null
          done
          for h in discovery/include/ebus/discovery/*.h; do
            echo "$h"
            echo "#include <${h#discovery/include/}>" | ${{ matrix.cxx }} $flags -x c++ -c - -o /dev/null
          done

  # The POSIX port (ports/posix): the core on Linux over Paho MQTT C, its demo programs,
  # and end-to-end tests against a mosquitto each test starts on a free localhost port.
  posix-port:
    name: POSIX port (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      - name: Configure
        run: >
          cmake -S ports/posix -B build-posix
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DEBUS_POSIX_PAHO=fetch
          -DEBUS_POSIX_WERROR=ON

      - name: Build
        run: cmake --build build-posix -j

      - name: Test
        run: ctest --test-dir build-posix --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: posix-e2e-logs-${{ matrix.cc }}
          path: build-posix/e2e
